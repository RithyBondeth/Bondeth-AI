# Bondeth AI
#
#   docker compose up -d                       # Postgres + Redis only (local development, tests)
#   docker compose --profile app up -d --build # the whole app: http://localhost:3000
#
# GPU servers: add -f docker-compose.gpu.yml (see that file).
# Settings come from .env next to this file (copy .env.example).

x-backend-env: &backend-env
  BONDETH_ENV: ${BONDETH_ENV:-production}
  BONDETH_JWT_SECRET: ${BONDETH_JWT_SECRET:-}  # required; the backend refuses to start without it
  BONDETH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bondeth}:${POSTGRES_PASSWORD:-bondeth}@postgres:5432/${POSTGRES_DB:-bondeth}
  BONDETH_REDIS_URL: redis://redis:6379/0
  BONDETH_CORS_ORIGINS: '["${PUBLIC_APP_URL:-http://localhost:3000}"]'
  BONDETH_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}  # links in emails
  # Email (verification and password reset). "log" only writes them to the backend log.
  BONDETH_EMAIL_BACKEND: ${BONDETH_EMAIL_BACKEND:-log}
  BONDETH_EMAIL_FROM: ${BONDETH_EMAIL_FROM:-Bondeth AI <no-reply@localhost>}
  BONDETH_SMTP_HOST: ${BONDETH_SMTP_HOST:-localhost}
  BONDETH_SMTP_PORT: ${BONDETH_SMTP_PORT:-587}
  BONDETH_SMTP_USERNAME: ${BONDETH_SMTP_USERNAME:-}
  BONDETH_SMTP_PASSWORD: ${BONDETH_SMTP_PASSWORD:-}
  # mms/omnivoice weights are non-commercial; voxcpm (Apache-2.0) needs the GPU image.
  BONDETH_TTS_ENGINE: ${BONDETH_TTS_ENGINE:-mms}
  BONDETH_CLONE_ENGINE: ${BONDETH_CLONE_ENGINE:-omnivoice}
  BONDETH_SOURCE_AUDIO_STORAGE_MB: ${BONDETH_SOURCE_AUDIO_STORAGE_MB:-1024}
  BONDETH_SOURCE_AUDIO_MAX_MB: ${BONDETH_SOURCE_AUDIO_MAX_MB:-128}
  BONDETH_BILLING_ENABLED: ${BONDETH_BILLING_ENABLED:-false}
  BONDETH_STRIPE_SECRET_KEY: ${BONDETH_STRIPE_SECRET_KEY:-}
  BONDETH_STRIPE_WEBHOOK_SECRET: ${BONDETH_STRIPE_WEBHOOK_SECRET:-}
  BONDETH_STRIPE_PRO_PRICE_ID: ${BONDETH_STRIPE_PRO_PRICE_ID:-}
  BONDETH_QUOTA_STT_SECONDS_PRO: ${BONDETH_QUOTA_STT_SECONDS_PRO:-18000}
  BONDETH_QUOTA_TTS_CHARS_PRO: ${BONDETH_QUOTA_TTS_CHARS_PRO:-250000}
  BONDETH_QUOTA_CLONE_JOBS_PRO: ${BONDETH_QUOTA_CLONE_JOBS_PRO:-100}
  # Live dictation previews re-run Whisper continuously; CPU-only servers should set false.
  BONDETH_STT_LIVE_PARTIALS: ${BONDETH_STT_LIVE_PARTIALS:-true}
  # Optional error tracking; nothing is sent while empty (see backend/app/monitoring.py).
  BONDETH_SENTRY_DSN: ${BONDETH_SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bondeth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bondeth}
      POSTGRES_DB: ${POSTGRES_DB:-bondeth}
    ports:
      - "127.0.0.1:5432:5432"  # localhost only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file so queued clone jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: brings the database schema up to date, then exits.
  migrate:
    profiles: [app]
    build: { context: ./backend }
    image: bondeth-ai/backend:${BACKEND_TAG:-cpu}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    profiles: [app]
    build: { context: ./backend }
    image: bondeth-ai/backend:${BACKEND_TAG:-cpu}
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Load models at startup so the first request isn't slow. Set to false to start faster.
      BONDETH_STT_PRELOAD: ${BONDETH_PRELOAD_MODELS:-true}
      BONDETH_TTS_PRELOAD: ${BONDETH_PRELOAD_MODELS:-true}
      BONDETH_CLONE_PRELOAD: ${BONDETH_PRELOAD_MODELS:-true}
      # Reverse proxies allowed to set the client IP (X-Forwarded-For); see .env.example.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      BONDETH_LIMITS_ENABLED: ${BONDETH_LIMITS_ENABLED:-true}
      BONDETH_CLONE_WORKER_ENABLED: ${BONDETH_CLONE_WORKER_ENABLED:-true}
      BONDETH_STT_WORKER_ENABLED: ${BONDETH_STT_WORKER_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"  # localhost only; docker-compose.prod.yml puts Caddy in front
    volumes:
      # Downloaded models (~6 GB). Defaults to backend/models so local downloads are reused.
      - ${MODELS_PATH:-./backend/models}:/app/models
      - backend-data:/app/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # Preloading downloads/loads several GB the first time, so allow a long start.
      start_period: 15m

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        # Inlined into the browser bundle: the backend address as the browser sees it.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        # This site's public address, for share-image (Open Graph) links.
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
        SEO_INDEXING: ${SEO_INDEXING:-true}
        # Shown on the privacy and terms pages for requests (GitHub issues when empty).
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    image: bondeth-ai/frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
  backend-data:
