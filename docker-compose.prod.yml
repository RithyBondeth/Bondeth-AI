# Public production deployment behind Caddy (automatic HTTPS), on one Docker host.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
#
# Add docker-compose.gpu.yml and/or docker-compose.workers.yml BEFORE this file; it must
# come last so the backend and frontend stay unpublished. See docs/deploy.md.
#
# Needs in .env: APP_DOMAIN (DNS A/AAAA records pointing at this server), ACME_EMAIL,
# and PUBLIC_APP_URL = PUBLIC_API_URL = https://APP_DOMAIN.

services:
  caddy:
    profiles: [app]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the public domain, e.g. bondeth.example.org}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for Let's Encrypt certificate notices}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data  # certificates; keep it, or Let's Encrypt rate limits can bite
      - caddy-config:/config
    depends_on:
      backend: { condition: service_started }
      frontend: { condition: service_started }

  backend:
    # Reachable only through Caddy on the Compose network.
    ports: !reset []
    environment:
      # Only Caddy can reach the backend (no published port), so trusting the
      # X-Forwarded-For it sets is safe; clients cannot set their own.
      FORWARDED_ALLOW_IPS: "*"

  frontend:
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
